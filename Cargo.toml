[workspace]
resolver = "2"
# `crates/pmbots-gengar` is added back in Task 4 of the gengar-rust-port plan,
# once that crate exists on disk. Listing it here before then makes the
# workspace fail to load.
members = ["crates/pmbots-arb"]

[workspace.dependencies]
anyhow             = "1.0"
async-trait        = "0.1"
base64             = "0.22"
chrono             = { version = "0.4", features = ["serde"] }
dotenvy            = "0.15"
ethers             = { version = "2.0", features = ["legacy"] }
futures-util       = "0.3"
hmac               = "0.12"
rand               = "0.8"
reqwest            = { version = "0.11", features = ["json", "blocking"] }
rsa                = { version = "0.9", features = ["sha2"] }
pkcs1              = { version = "0.7", features = ["pem"] }
serde              = { version = "1.0", features = ["derive", "rc"] }
serde_json         = "1.0"
sha2               = "0.10"
tokio              = { version = "1.0", features = ["full"] }
tokio-tungstenite  = { version = "0.21", features = ["native-tls"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustc-hash         = "2.0"
tiny-keccak        = { version = "2.0", features = ["keccak"] }
governor           = "0.6"
nonzero_ext        = "0.3"
arrayvec           = "0.7"
wide               = "0.7"
hex                = "0.4"
tempfile           = "3.27.0"
criterion          = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
